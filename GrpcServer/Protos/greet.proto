syntax = "proto3";

option csharp_namespace = "GrpcServer.Services";

package greet;

service Greeter {
  
  rpc SayHello (HelloRequest) returns (HelloReply);
  
  rpc ChatStream (stream ChatMessage) returns (stream ChatMessage);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

// New message definition for our chat stream
message ChatMessage {
  string user = 1;
  string text = 2;
}