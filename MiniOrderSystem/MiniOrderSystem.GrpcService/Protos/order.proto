syntax = "proto3";

option csharp_namespace = "MiniOrderSystem.GrpcService";

package orders;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderReply);
  rpc GetOrder (GetOrderRequest) returns (OrderReply);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersReply);
  rpc CancelOrder (CancelOrderRequest) returns (OrderReply);
}

enum OrderStatus {
  ORDER_STATUS_PENDING = 0;
  ORDER_STATUS_PROCESSING = 1;
  ORDER_STATUS_COMPLETED = 2;
  ORDER_STATUS_FAILED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message CancelOrderRequest {
  int32 id = 1;
} 
message CreateOrderRequest {
  string customer_name = 1;
  string product_name = 2;
  int32 quantity = 3;
}

message GetOrderRequest {
  int32 id = 1;
}

message ListOrdersRequest {
}

message ListOrdersReply {
  repeated OrderReply orders = 1;
}

message OrderReply {
  int32 id = 1;
  string customer_name = 2;
  string product_name = 3;
  int32 quantity = 4;
 OrderStatus status = 5;
}